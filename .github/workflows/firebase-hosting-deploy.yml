name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
      - claude/firestore-farms-security-rules-n8hl6v
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_FAZENDA_E3652 }}'
          channelId: live
          projectId: fazenda-e3652
