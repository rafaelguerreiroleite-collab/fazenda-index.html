name: Publicar Meus Gastos no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# O deploy do Pages precisa destas permissoes no GITHUB_TOKEN.
# 'pages: write' e o que permite ao configure-pages criar o site sozinho.
permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicacao por vez; nao cancela a que ja esta rodando.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Só o app vai para o site. Os arquivos de apoio (LEIA-ME, regras do
      # Firestore, README) ficam no repositorio, fora da pasta publicada.
      - name: Juntar os arquivos do app
        run: |
          mkdir -p _site
          cp index.html config.js sw.js manifest.json icone-192.png icone-512.png _site/

      - name: Ativar e configurar o Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
