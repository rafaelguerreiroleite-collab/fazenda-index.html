name: Publicar Gastos Giovanna

on:
  push:
    branches: [main]
  workflow_dispatch:

# Um deploy por vez; nao cancela o que ja esta rodando.
concurrency:
  group: publicar-gastos
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Só o app vai para o ar. LEIA-ME, README e as regras do Firestore
      # ficam no repositorio, fora da pasta publicada.
      - name: Juntar os arquivos do app
        run: |
          mkdir -p _site
          cp index.html config.js sw.js manifest.json icone-192.png icone-512.png _site/

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Firebase CLI
        run: npm install --no-save firebase-tools

      # O site do Gastos Giovanna e separado do site da Fazenda J.S: outro
      # site de Hosting, outro endereco. Nada aqui toca em fazenda-e3652.web.app.
      #
      # Este passo publica so os arquivos estaticos. A ligacao com o
      # Firestore ja vai pronta dentro do config.js, e as regras de
      # seguranca sao publicadas a mao no console do Firebase: a conta de
      # servico deste deploy tem permissao de Hosting e mais nada.
      - name: Publicar no site proprio
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FAZENDA_E3652 }}
          PROJETO: fazenda-e3652
          SITE: gastos-giovanna
        run: |
          set -euo pipefail
          if [ -z "$SA" ]; then
            echo "::error::O secret FIREBASE_SERVICE_ACCOUNT_FAZENDA_E3652 esta vazio ou nao existe."
            exit 1
          fi
          printf '%s' "$SA" > /tmp/sa.json
          FB="npx firebase -P $PROJETO"

          # Cria o site na primeira vez. Se ja existir, segue em frente.
          $FB hosting:sites:create "$SITE" \
            || echo "Site '$SITE' ja existe, seguindo para o deploy."

          $FB target:apply hosting gastos "$SITE"
          $FB deploy --only hosting:gastos

          echo "PUBLICADO EM: https://$SITE.web.app"
